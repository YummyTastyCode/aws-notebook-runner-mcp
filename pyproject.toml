[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-notebook-runner-mcp"
version = "0.0.1"
description = "MCP server for guarded AWS notebook execution with EC2/SSM and SageMaker planning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "YummyTastyCode" },
]
keywords = [
  "aws",
  "mcp",
  "notebook",
  "jupyter",
  "ec2",
  "ssm",
  "sagemaker",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.9,<2",
  "nbformat>=5.10,<6",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.34,<2",
  "pytz>=2024.1",
  "sagemaker>=2.220,<3",
]
test = [
  "pytest>=8,<9",
]

[project.scripts]
aws-notebook-runner-mcp = "aws_notebook_runner_mcp.server:main"

[project.urls]
Homepage = "https://github.com/YummyTastyCode/aws-notebook-runner-mcp"
Issues = "https://github.com/YummyTastyCode/aws-notebook-runner-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_notebook_runner_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/aws_notebook_runner_mcp",
  "tests",
  ".github/workflows",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "manifest.0",
  "SECURITY.md",
  "pyproject.toml",
]
exclude = [
  "RESEARCH_NOTES.md",
  ".aws-notebook-runs",
  ".venv",
  ".pytest_cache",
  "dist",
  "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
